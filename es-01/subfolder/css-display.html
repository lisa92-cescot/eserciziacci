<html lang="en">
<head>
    <link rel="stylesheet" href="display.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="inline">
        <h2>Display Inline</h2>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>

    <h2>Display block</h2>
    <div class="block">
    <span>1</span>
    <span>2</span>
    <span>3</span>
    <span>4</span>
    </div>

    <h2>Display inline-block</h2>
    <div class="inline-block">
    <span>1</span>
    <span>2</span>
    <span>3</span>
    <span>4</span>
    </div>

    <h2>Display none & hidden</h2>
    </div>
    <span class="none">2 </span>
    <span>1</span>
    <span class="none"></span>
    <span class="hidden"></span>
    <span>4</span>
</div>
<h2>Display opacity</h2>
    <div class="inline-block">
    <span>1</span>
    <span>2</span>
    <span class="opacity-0">3</span>
    <span>4</span>
    </div>

    <h2>Display flex:</h2>
    <div class="flex justify-end">
    <div class="grow-1">1</div>
    <div class="grow-2">2</div>
    <div>3</div>
    <div>4</div>
    </div>
</body>
</html>
